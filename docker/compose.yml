services:
  gitstars:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        VITE_GITSTARS_CLIENT_ID: ${VITE_GITSTARS_CLIENT_ID}
        VITE_BASE_PATH: /gitstars/
    container_name: gitstars
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      SERVER_PORT: "8091"
      SERVER_BIND: "127.0.0.1"
      VITE_GITSTARS_CLIENT_SECRET: ${VITE_GITSTARS_CLIENT_SECRET}
      HTTP_PROXY: ${HTTP_PROXY:-http://127.0.0.1:17890}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://127.0.0.1:17890}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8091/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
